# ============================================
# nginx 反向代理配置
# 优化于 2026-07-23
# ============================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- 基础性能优化 ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20m;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---- 日志配置 ----
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;

        # ---- 安全响应头 ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ---- 静态资源长期缓存 ----
        # 注意：nginx 容器与 app 容器文件系统隔离，静态文件不存在于 nginx 容器内，
        # 因此不能使用 alias/root 直接读取文件，必须通过 proxy_pass 代理到 app 容器。
        # 使用 ^~ 确保前缀匹配优先于正则匹配，防止被后面的 ~* \.(woff2|woff|ttf)$ 覆盖。

        # Next.js 静态构建产物（带哈希的 JS/CSS/字体）
        location ^~ /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://app:3500;
        }

        # 公共静态资源（图片、图标、字体）
        location ^~ /images/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
            proxy_pass http://app:3500;
        }

        location ^~ /logos/ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, must-revalidate" always;
            proxy_pass http://app:3500;
        }

        location ^~ /data/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate" always;
            proxy_pass http://app:3500;
        }

        # 字体文件长期缓存（匹配非 /_next/static/ 路径下的独立字体文件）
        location ~* \.(woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://app:3500;
        }

        # 发版检测版本文件：禁止任何缓存，确保前端轮询能拿到最新版本
        location = /version.json {
            add_header Cache-Control "no-store" always;
            proxy_pass http://app:3500;
        }

        # ---- 主要代理 ----
        location / {
            # app 为独立容器，需通过 compose 服务名在内网访问（localhost 指向 nginx 自身）
            proxy_pass http://app:3500;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 代理缓存控制
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # ---- 健康检查端点 ----
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK";
        }
    }
}
